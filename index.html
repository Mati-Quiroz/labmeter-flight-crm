<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Labmeter Flight CRM | Centro de Entrenamiento & Simulación de Vuelo</title>

  <!-- Fuente Mandatoria: Montserrat -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Montserrat', 'sans-serif'],
          },
          colors: {
            bgDeep: '#071014',
            bgSurface: '#0A1F24',
            borderPassive: '#0F3A3F',
            accentSecondary: '#1C6B6A',
            accentPrimary: '#B8F2E6',
            textMain: '#E2E8F0',
          }
        }
      }
    };
  </script>

  <!-- Variables CSS Mandatorias (:root) -->
  <style>
    :root {
      --bg-deep: #071014;
      --bg-surface: #0A1F24;
      --border-passive: #0F3A3F;
      --accent-secondary: #1C6B6A;
      --accent-primary: #B8F2E6;
      --text-main: #E2E8F0;
      --font-main: 'Montserrat', sans-serif;
    }

    * {
      font-family: var(--font-main);
      box-sizing: border-box;
    }

    body {
      background-color: var(--bg-deep);
      color: var(--text-main);
      margin: 0;
      overflow-x: hidden;
    }

    ::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }
    ::-webkit-scrollbar-track {
      background: var(--bg-deep);
    }
    ::-webkit-scrollbar-thumb {
      background: var(--border-passive);
      border-radius: 4px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: var(--accent-secondary);
    }
  </style>
</head>
<body class="min-h-screen bg-[#071014] text-[#E2E8F0] relative flex flex-col antialiased">

  <!-- FONDO AMBIENTAL CABINA A320 FTD -->
  <div
    class="fixed inset-0 pointer-events-none z-0 opacity-20 bg-cover bg-center"
    style="background-image: url('./A320%20FTD.jpeg'), url('https://images.unsplash.com/photo-1540962351504-03099e0a754b?auto=format&fit=crop&w=1600&q=85');"
  ></div>
  <div class="fixed inset-0 pointer-events-none z-0 bg-gradient-to-b from-[#071014]/85 via-[#071014]/90 to-[#071014]"></div>

  <!-- NOTIFICACIÓN FLOTANTE (TOAST) -->
  <div id="toast-container" class="fixed bottom-5 right-5 z-50 hidden max-w-md bg-[#0A1F24] border-2 border-[#B8F2E6] text-[#E2E8F0] px-5 py-4 rounded-xl shadow-2xl items-center gap-3">
    <span class="w-3 h-3 rounded-full bg-[#B8F2E6] shrink-0"></span>
    <p id="toast-text" class="text-xs sm:text-sm font-semibold"></p>
  </div>

  <!-- HEADER SUPERIOR CON LOS 3 LOGOS CORPORATIVOS -->
  <header class="relative z-10 bg-[#0A1F24]/95 backdrop-blur-md border-b border-[#0F3A3F] sticky top-0">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 py-3 flex flex-col lg:flex-row lg:items-center lg:justify-between gap-4">
      
      <!-- Logos de las 3 Empresas -->
      <div class="flex flex-wrap items-center gap-3">
        <!-- Logo 1: Labmeter Training Center -->
        <div class="bg-[#E2E8F0] px-3 py-1.5 rounded-lg flex items-center shadow-sm border border-[#B8F2E6]/40">
          <img
            src="./LABMETER%20training%20Center%20LOGO%20PNG%20.png"
            alt="Labmeter Training Center"
            class="h-8 sm:h-9 object-contain"
            onerror="this.style.display='none'; this.nextElementSibling.style.display='block';"
          />
          <div style="display:none" class="leading-none text-[#071014]">
            <div class="font-extrabold tracking-tight text-xs"><span class="text-neutral-600">LAB</span><span class="text-[#0c2d57]">METER</span></div>
            <div class="font-bold tracking-widest text-[9px]"><span class="text-[#0c2d57]">TRAINING </span><span class="text-neutral-600">CENTER</span></div>
          </div>
        </div>

        <!-- Logo 2: IFR LabTraining -->
        <div class="bg-[#E2E8F0] px-3 py-1.5 rounded-lg flex items-center shadow-sm border border-[#B8F2E6]/40">
          <img
            src="./IFR_LT_fnl.png"
            alt="IFR LabTraining"
            class="h-8 sm:h-9 object-contain"
            onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';"
          />
          <div style="display:none" class="items-center gap-1.5 text-[#071014] leading-none">
            <span class="w-6 h-6 rounded-full bg-[#0077a8] text-white flex items-center justify-center text-[10px] font-bold">✈</span>
            <div>
              <div class="font-extrabold italic text-neutral-700 text-xs">IFR</div>
              <div class="font-extrabold text-[#0077a8] text-[10px]">LabTraining</div>
            </div>
          </div>
        </div>

        <!-- Logo 3: LabMeter -->
        <div class="bg-black px-3 py-1.5 rounded-lg flex items-center shadow-sm border border-[#0F3A3F]">
          <img
            src="./LogoNormal.jpg"
            alt="LabMeter"
            class="h-8 sm:h-9 object-contain"
            onerror="this.style.display='none'; this.nextElementSibling.style.display='block';"
          />
          <div style="display:none" class="leading-none">
            <div class="text-neutral-400 font-bold text-xs">Lab</div>
            <div class="text-[#0095d9] font-extrabold text-xs">Meter</div>
          </div>
        </div>

        <div class="hidden xl:block pl-3 border-l border-[#0F3A3F]">
          <span class="text-[11px] uppercase tracking-widest text-[#B8F2E6] font-bold block">Flight Simulation & Training CRM</span>
          <span class="text-xs text-[#E2E8F0]/70">4 Simuladores Operativos · Control QR TOTP · DAN 147</span>
        </div>
      </div>

      <!-- Botones de Navegación -->
      <nav class="flex flex-wrap items-center gap-1.5" id="nav-tabs">
        <button onclick="switchTab('booking')" id="tab-btn-booking" class="px-3.5 py-2 rounded-lg text-xs font-bold transition-all focus:outline-none focus:ring-2 focus:ring-[#B8F2E6] bg-[#1C6B6A] text-[#B8F2E6] border border-[#B8F2E6]/50 shadow-lg">
          1. Link Reserva Pilotos
        </button>
        <button onclick="switchTab('shifts')" id="tab-btn-shifts" class="px-3.5 py-2 rounded-lg text-xs font-bold transition-all focus:outline-none focus:ring-2 focus:ring-[#B8F2E6] bg-[#071014]/70 text-[#E2E8F0]/80 border border-[#0F3A3F] hover:bg-[#1C6B6A]/40 hover:text-white">
          2. Turnos & QR Operadores
        </button>
        <button onclick="switchTab('crm')" id="tab-btn-crm" class="px-3.5 py-2 rounded-lg text-xs font-bold transition-all focus:outline-none focus:ring-2 focus:ring-[#B8F2E6] bg-[#071014]/70 text-[#E2E8F0]/80 border border-[#0F3A3F] hover:bg-[#1C6B6A]/40 hover:text-white">
          3. CRM Clientes & Reservas
        </button>
        <button onclick="switchTab('marketing')" id="tab-btn-marketing" class="px-3.5 py-2 rounded-lg text-xs font-bold transition-all focus:outline
