    // =========================================================================
    // UTILIDADES DE CÁLCULO DE HORAS DE OPERADOR Y UBER (21:00 A 06:00)
    // =========================================================================
    function analyzeShiftRules(startStr, endStr, isWeekend) {
      const toMinutes = (t) => {
        const [h, m] = t.split(":").map(Number);
        return h * 60 + m;
      };
      const startMin = toMinutes(startStr);
      const endMin = toMinutes(endStr);
      const totalHours = Math.max(0, (endMin - startMin) / 60);

      // Horario normal: 08:00 (480) a 18:00 (1080)
      const normalStart = 8 * 60;
      const normalEnd = 18 * 60;

      let regularHours = 0;
      let extensionHours = 0;
      let activationHours = 0;

      if (isWeekend) {
        activationHours = totalHours;
      } else {
        const overlapStart = Math.max(startMin, normalStart);
        const overlapEnd = Math.min(endMin, normalEnd);
        regularHours = Math.max(0, (overlapEnd - overlapStart) / 60);

        if (endMin > normalEnd) {
          extensionHours = (endMin - Math.max(startMin, normalEnd)) / 60;
        }
        if (startMin < normalStart) {
          activationHours = (Math.min(endMin, normalStart) - startMin) / 60;
        }
      }

      // Regla de Movilización (Uber): término de operación entre 21:00 (1260) y 06:00 (360)
      const endHour = Math.floor(endMin / 60);
      const requiresUber = endHour >= 21 || endHour <= 6;

      return {
        totalHours: totalHours.toFixed(1),
        regularHours: regularHours.toFixed(1),
        extensionHours: extensionHours.toFixed(1),
        activationHours: activationHours.toFixed(1),
        requiresUber
      };
    }
